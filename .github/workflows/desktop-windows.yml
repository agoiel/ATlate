name: Desktop on Windows

# Проверки, которым нужна настоящая Windows: горячие клавиши (через систему, при английской
# и русской раскладке) и общие тесты языков и глоссария.
on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    paths:
      - "desktop/**"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q PySide6-Essentials numpy Pillow requests pynput pyphen
      - name: Hotkeys with English and Russian keyboard layouts
        run: python tools/test_hotkeys_win.py
      - name: Languages, translator requests, glossary
        run: python tools/test_languages.py ../out/languages
      - name: Studio text in Thai and Arabic (fonts, hyphenation, shaping)
        run: python tools/test_typeset_langs.py ../out/typeset
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-checks
          path: out
