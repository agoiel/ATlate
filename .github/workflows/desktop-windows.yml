name: Desktop on Windows

# Проверки, которым нужна настоящая Windows: горячие клавиши (через систему, при английской
# и русской раскладке) и общие тесты языков и глоссария.
on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    paths:
      - "desktop/**"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -q PySide6-Essentials numpy Pillow requests pynput pyphen pyinstaller
      - name: FriBiDi for Arabic and Thai text layout (the same step as in the release build)
        shell: pwsh
        run: ./tools/get_fribidi.ps1
      - name: Hotkeys with English and Russian keyboard layouts
        run: python tools/test_hotkeys_win.py
      - name: Languages, translator requests, glossary
        run: python tools/test_languages.py ../out/languages
      - name: Interface language (English everywhere, follows the system language)
        run: python tools/test_i18n.py ../out/i18n
      - name: Studio text in Thai and Arabic (fonts, hyphenation, shaping)
        run: python tools/test_typeset_langs.py ../out/typeset
      - name: Files bundled into the exe are found (FriBiDi, hyphenation dictionaries)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onedir --log-level WARN --name frozen_check `
            --distpath ../out/frozen --workpath ../out/frozen-build `
            --add-data "libs;libs" --collect-data pyphen tools/frozen_check.py
          ../out/frozen/frozen_check/frozen_check.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item -Recurse -Force ../out/frozen, ../out/frozen-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-checks
          path: out
