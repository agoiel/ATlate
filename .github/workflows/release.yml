name: Release

# Запускается, когда на GitHub публикуется релиз (Releases → Draft a new release).
# Собирает APK и exe и прикрепляет их к этому релизу.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Номер версии в коде совпадает с тегом: иначе программа покажет старый номер,
  # как было с 0.6.4 и 0.6.5 (в окне стояло 0.6.3)
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Version in code matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/check_version.py "$TAG"

  android:
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --stacktrace --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ATlate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ATlate-android
          path: android/out/ATlate.apk

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Font for typesetting
        shell: bash
        run: bash tools/get_fonts.sh fonts

      - name: FriBiDi for Arabic and Thai text in Studio
        # без него программа тоже собирается — Студия тогда верстает текст попроще
        continue-on-error: true
        run: ./tools/get_fribidi.ps1

      - name: Build exe
        run: |
          $libs = @()
          if (Test-Path libs/libfribidi-0.dll) { $libs = @("--add-data", "libs;libs") }
          python -m PyInstaller --noconfirm --clean --windowed --name ATlate `
            --icon icon.ico --add-data "icon.png;." @libs `
            --collect-all winrt --collect-data pyphen `
            --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 `
            --collect-data faster_whisper --collect-binaries ctranslate2 --collect-binaries onnxruntime `
            --exclude-module av --exclude-module hf_xet --exclude-module pandas `
            --exclude-module torch --exclude-module torchvision --exclude-module easyocr `
            main.py
          Copy-Item -Recurse glossaries dist/ATlate/glossaries
          if (Test-Path fonts) { Copy-Item -Recurse fonts dist/ATlate/fonts }
          Compress-Archive -Path dist/ATlate -DestinationPath ATlate-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ATlate-windows
          path: desktop/ATlate-windows.zip

  release:
    needs: [android, windows]
    # Релиз выходит, даже если сборка для Windows не удалась
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      # описание: «Что нового» из release-notes/<тег>.md (если файл есть) и инструкция по установке
      - name: Release notes
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/release_notes.py compose "$TAG" > release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ATlate ${{ github.event.release.tag_name }}
          files: files/*
          body_path: release-body.md
